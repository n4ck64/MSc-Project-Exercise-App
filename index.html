<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>ReFit</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="icon.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">


</head>

<body>
    <h1>ReFit</h1>
    <div id="layout">
        <div id="sidebar">
            <div class="sidebar-tab">Exercises</div>
            <div class="sidebar-tab">Plans</div>
            <div class="sidebar-tab">Chat History</div>
            <div class="sidebar-tab">Settings</div>
        </div>
        <div id="chat-window">
            <div id="input-area">
                <input id="user-input" autocomplete="off" placeholder=" Ask something!">
                <button id="send-btn" title="Send message"><i class="fa-solid fa-paper-plane"></i></button>
                <label for="media-upload" title="Attach file">
                    <i class="fa-solid fa-paperclip"></i>
                </label>
                <input type="file" id="media-upload" accept="image/*, video/*" style="display:none">
                <img id="image-preview" style="display:none">
                <video id="video-preview" controls style="display:none"></video>
            </div>
        </div>
        <img id="user-avatar" src="chad.png">

    </div>

    <script src="index.js"></script>
</body>

</html>
